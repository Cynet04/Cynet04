<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="ct cd" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="ct">Horologium</title>
  <desc id="cd">An animated Roman-numeral clock face in gold on ink, with the caption: Visitors to the atelier. The hands turn slowly and do not show the real time.</desc>
  <style>
    .hand { transform-origin: 150px 120px; animation-iteration-count: infinite; animation-timing-function: linear; }
    .hour { transform: rotate(305deg); animation-name: hour; animation-duration: 43200s; }
    .minute { transform: rotate(60deg); animation-name: minute; animation-duration: 3600s; }
    .second { animation-name: second; animation-duration: 60s; animation-timing-function: steps(60, end); }
    @keyframes hour { from { transform: rotate(305deg); } to { transform: rotate(665deg); } }
    @keyframes minute { from { transform: rotate(60deg); } to { transform: rotate(420deg); } }
    @keyframes second { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .hand { animation: none; } }
  </style>
